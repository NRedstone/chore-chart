  // ------------------------------------------------------------------ boot
  // Loops until this device has a way into a household, showing whichever
  // screen is needed. Resolves with the session.
  function start(env) {
    S.db = env.db; S.auth = env.auth; S.fns = env.fns; S.authDomain = env.authDomain || null;
    function loop() {
      return restoredUser().then(function (user) {
        var memberP = user
          ? readMember(user.uid).catch(function (e) {
              // Offline start: trust what we knew last time rather than locking the family out.
              try {
                var cached = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
                if (cached && cached.uid === user.uid && e && e.code === "unavailable") return { hid: cached.hid, role: cached.role };
              } catch (x) {}
              throw e;
            })
          : Promise.resolve(null);
        return memberP.then(function (member) {
          var legacyCode = getStoredCode();
          var d = decideBoot({ user: user, member: member, legacyCode: legacyCode });
          if (d.mode === "account") {
            return { mode: "account", hid: member.hid, role: member.role, user: user };
          }
          if (d.mode === "legacy") {
            return readStatus(legacyCode).then(function (st) {
              if (st && st.claimed && !st.graceActive) return protectedScreen().then(loop);
              return { mode: "legacy", hid: legacyCode, status: st };
            });
          }
          if (d.mode === "verify-email") return ensureVerified().then(loop);
          if (d.mode === "needs-household") return setupHouseholdScreen(user, legacyCode).then(loop);
          return welcomeScreen(takeNotice()).then(loop);
        });
      });
    }
    return loop();
  }

  // ------------------------------------------------------------------ losing access
  var lostHandled = false;
  function handleAccessLost() {
    if (lostHandled) return Promise.resolve();
    lostHandled = true;
    var n = 0;
    try { n = Number(sessionStorage.getItem("cc-lost-n") || 0) + 1; sessionStorage.setItem("cc-lost-n", String(n)); } catch (e) {}
    if (n > 3) { toast("Can't reach the household right now. Try again in a few minutes."); return Promise.resolve(); }
    var account = S.session && S.session.mode === "account";
    try {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.setItem(NOTICE_KEY, account
        ? "This device no longer has access to the household. If that's a surprise, ask the owner for a new link code."
        : "This household is now protected. Link this device with a code from the owner.");
    } catch (e) {}
    var out = account ? S.auth.signOut() : Promise.resolve();
    return Promise.resolve(out).catch(function () {}).then(function () { window.location.reload(); });
  }
  function checkAccess() {
    if (!S.session || S.session.mode !== "account") return Promise.resolve();
    return readMember(S.session.user.uid).then(function (m) {
      if (!m || m.hid !== S.session.hid) return handleAccessLost();
      // A small read the rules only allow for a session that's still welcome:
      // it also catches a sign-in that was cut off by "sign out all other devices".
      return S.db.collection("access").doc(S.session.hid).get();
    }).catch(function (e) {
      if (e && e.code === "permission-denied") return handleAccessLost();
    });
  }

  // ------------------------------------------------------------------ legacy (pre-accounts) devices
  function secureThisHousehold() {
    var ov = openOverlay("dim");
    var err = errorLine();
    ov.card.appendChild(title("Secure this household"));
    ov.card.appendChild(sub("Sign in with Google or email to become its owner. Nothing about your chores changes."));
    var go = primaryBtn("Continue", null);
    go.id = "cc-secure-go";
    go.onclick = function () {
      var code = getStoredCode();
      ov.close();
      ownerAuth("create").then(function (r) {
        if (r !== "done") return;
        return call("claimHousehold", { code: code }).then(function (res) {
          clearStoredCode();
          return claimedScreen(res.graceUntil).then(function () { window.location.reload(); });
        }, function (e) {
          // Signed in but couldn't claim: the setup screen after the reload offers it again.
          toast(friendlyError(e));
          setTimeout(function () { window.location.reload(); }, 2500);
        });
      });
    };
    ov.card.appendChild(go);
    ov.card.appendChild(err);
    ov.card.appendChild(textLink("Not now", ov.close));
  }
  function linkThisDevice() {
    linkScreen().then(function (r) {
      if (r === "linked") window.location.reload();
      else if (r === "owner") ownerAuth("signin").then(function (r2) { if (r2 === "done") window.location.reload(); });
    });
  }

  function showLegacyBanner(status) {

    bar.appendChild(h("span", { text: text, style: "font-size:13px;font-weight:800;color:#2B2250;margin-right:8px;" }));
    bar.appendChild(h("button", { type: "button", text: "Later", onClick: function () { try { sessionStorage.setItem("cc-banner-off", "1"); } catch (e) {} if (bar.parentNode) bar.parentNode.removeChild(bar); }, style: "min-height:40px;padding:0 10px;border:none;background:none;cursor:pointer;font:700 13px " + FONT + ";color:#6F66AD;" }));
    var go = h("button", { type: "button", text: label, onClick: action, style: "min-height:40px;padding:0 18px;border:none;border-radius:999px;cursor:pointer;background:" + GRADIENT + ";color:#fff;font:800 13px " + FONT + ";" });

  // ------------------------------------------------------------------ Devices screen
  // The Devices screen. With no argument it opens as its own popup; given an
  // element (the Devices tab inside Settings), it draws itself in there
  // instead, and returns a function that cleans it up when the tab closes.
  function openDevicesModal(host) {
    var s = S.session;
    if (!s) return null;
    var embedded = !!host;
    var ov;
    if (embedded) {
      ov = { root: host, card: host, close: function () { while (host.firstChild) host.removeChild(host.firstChild); } };
    } else {
      ov = openOverlay("dim");
      ov.card.id = "cc-devices";
    }
    var unsub = null;
    var timers = [];
    var closed = false;
    function closeAll() {
      if (closed) return;
      closed = true;
      timers.forEach(clearInterval);
      timers = [];
      if (unsub) unsub();
      ov.close();
    }
    var body = h("div");
    if (!embedded) {
      ov.root.onclick = function (e) { if (e.target === ov.root) closeAll(); };
      var head = h("div", { style: "display:flex;align-items:center;margin-bottom:12px;" });
      head.appendChild(h("div", { text: "Devices", style: "flex:1;font-size:20px;font-weight:800;color:#2B2250;" }));
      head.appendChild(h("button", { type: "button", "aria-label": "Close", text: "\u00d7", onClick: closeAll, style: "border:none;background:none;color:#B7ACE3;font-size:26px;cursor:pointer;line-height:1;padding:0 4px;" }));
      ov.card.appendChild(head);
    }
    ov.card.appendChild(body);

    // ---- legacy (not yet on accounts) view
    if (s.mode === "legacy") {
      body.appendChild(para("Right now this household is opened only with its code, so anyone who learns the code can get in. Signing in (Google or email) makes you its owner and lets you link devices one at a time.", "margin-bottom:6px;"));
      var st = s.status;
      if (st && st.claimed && st.graceActive) {
        body.appendChild(para("It already has an owner. This device keeps working the old way until " + fmtDate(st.graceUntil) + ". Link it with a code from the owner's Devices screen.", "margin:10px 0;"));
        var lb = primaryBtn("Link this device", function () { closeAll(); linkThisDevice(); });
        lb.id = "cc-devices-link-this";
        body.appendChild(lb);
      } else {
        var sb = primaryBtn("Secure this household", function () { closeAll(); secureThisHousehold(); });
        sb.id = "cc-devices-secure";
        body.appendChild(sb);
      }
      return closeAll;
    }

    // ---- account view
    var isOwner = s.role === "owner";
    var uiState = { acc: null, status: null, msg: "", note: "", link: null, renaming: null, pending: null, emailDraft: "", renameDraft: "" };
    var redrawLater = false;
    // Changes made on other devices redraw this screen. Never do that while
    // someone is typing in a field here: wait until they click away.
    function typingHere() {
      var a = document.activeElement;
      return !!(a && a.tagName === "INPUT" && ov.card.contains(a));
    }
    function softRender() {
      if (typingHere()) { redrawLater = true; return; }
      render();
    }
    ov.card.addEventListener("focusout", function () {
      if (!redrawLater) return;
      setTimeout(function () { if (!typingHere()) { redrawLater = false; render(); } }, 0);
    });
    function say(m) { uiState.msg = m || ""; softRender(); }
    function fail(e) { say(friendlyError(e)); }

    // Some owner actions need a fresh sign-in: Google opens its pop-up
    // (straight from the tap), an email account types its password again.
    function reauth() { return confirmOwnerIdentity(); }
    function loadStatus() {
      return readStatus(s.hid).then(function (st) { uiState.status = st; render(); });
    }

    function confirmable(key, label, confirmLabel, run, danger) {
      if (uiState.pending !== key) return smallBtn(label, function () { uiState.pending = key; render(); }, danger);
      var wrap = h("span", { style: "display:inline-flex;gap:6px;align-items:center;" });
      wrap.appendChild(h("span", { text: "Sure?", style: "font-size:12px;font-weight:700;color:#C0392B;" }));
      var yes = smallBtn(confirmLabel, function () { uiState.pending = null; run(); }, true);
      yes.setAttribute("data-confirm", key);
      wrap.appendChild(yes);
      wrap.appendChild(smallBtn("Cancel", function () { uiState.pending = null; render(); }));
      return wrap;
    }

    function startLinkCode() {
      uiState.msg = "";
      uiState.note = "";
      call("createLinkCode").then(function (r) { uiState.link = { code: r.code, expiresAt: r.expiresAt, seen: false }; render(); }).catch(fail);
    }

    function render() {
      timers.forEach(clearInterval);
      timers = [];
      while (body.firstChild) body.removeChild(body.firstChild);
      var acc = uiState.acc;
      if (!acc) { body.appendChild(para("Loading\u2026")); return; }

      // A code we've shown that has since vanished from the household's list was used.
      var L = uiState.link;
      if (L) {
        var present = !!(acc.linkCodes && acc.linkCodes[L.code]);
        if (present) L.seen = true;
        else if (L.seen) { uiState.link = null; uiState.note = "That code was used. The device is now linked."; }
      }
      if (uiState.note) body.appendChild(h("div", { id: "cc-devices-note", role: "status", text: uiState.note, style: "background:#E8F8EF;color:#1E7B4B;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px;" }));
      if (uiState.msg) body.appendChild(h("div", { id: "cc-devices-msg", role: "alert", text: uiState.msg, style: "background:#FDECEA;color:#C0392B;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px;" }));

      var me = acc.devices && acc.devices[s.user.uid];
      body.appendChild(para(isOwner
        ? "You're signed in as the owner (" + (acc.ownerEmail || "your account") + ")."
        : "This is a linked device" + (me ? " (\u201c" + me.name + "\u201d)." : "."), "margin-bottom:12px;"));

      // grace window
      var st = uiState.status;
      if (isOwner && st && st.graceActive) {
        var g = h("div", { id: "cc-grace", style: "background:#F4F0FF;border-radius:12px;padding:10px 12px;margin-bottom:12px;" });
        g.appendChild(para("Devices that haven't been linked yet still work with the old household code until " + fmtDate(st.graceUntil) + ". Once everything is linked, you can end that now."));
        var endBtn = confirmable("endgrace", "End it now", "End now", function () { call("endGrace").then(loadStatus).catch(fail); }, true);
        endBtn.style.marginTop = "8px";
        g.appendChild(h("div", { style: "margin-top:8px;" }, [endBtn]));
        body.appendChild(g);
      }

      // device list
      var list = h("div", { id: "cc-device-list", style: "border-top:1.5px solid #F1EDFF;" });
      var ids = Object.keys(acc.devices || {}).sort(function (a, b) { return (acc.devices[a].linkedAt || 0) - (acc.devices[b].linkedAt || 0); });
      if (!ids.length) list.appendChild(para("No devices linked yet.", "padding:12px 0;color:#8A82C0;"));
      ids.forEach(function (uid) {
        var d = acc.devices[uid];
        var row = h("div", { "data-uid": uid, style: "display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1.5px solid #F1EDFF;flex-wrap:wrap;" });
        var info = h("div", { style: "flex:1;min-width:120px;" });
        if (isOwner && uiState.renaming === uid) {
          var inp = textInput("Device name", 40, uiState.renameDraft || d.name, false);
          inp.setAttribute("data-rename", uid);
          inp.oninput = function () { uiState.renameDraft = inp.value; };
          info.appendChild(inp);
        } else {
          info.appendChild(h("div", { text: d.name + (uid === s.user.uid ? "  (this device)" : ""), style: "font-size:14px;font-weight:800;color:#2B2250;" }));
          info.appendChild(h("div", { text: "Linked " + fmtDateTime(d.linkedAt), style: "font-size:12px;font-weight:600;color:#8A82C0;" }));
        }
        row.appendChild(info);
        if (isOwner) {
          var acts = h("div", { style: "display:flex;gap:6px;align-items:center;flex-wrap:wrap;" });
          if (uiState.renaming === uid) {
            acts.appendChild(smallBtn("Save", function () {
              var v = row.querySelector("input").value;

      var so = confirmable("signoutothers", "Sign out all other devices", "Sign out others", function () {

      var pt = acc.pendingTransfer;
      if (pt && pt.expiresAt > Date.now()) {
        tr.appendChild(para("Offered to " + pt.toEmail + ". Give them this code. They sign in with that email (Google or email and password), choose \u201cI'm taking over a household\u201d, and type it.", "margin:4px 0 8px;"));

// Firestore-backed sync for The Chore Chart.
//
// Every device using a household sees the same data, live, within a second or
// two. Who is allowed in is decided by account-ui.js (Google or email sign-in for the
// owner, one-time link codes for other devices) and enforced by the Firestore
// security rules in firebase/firestore.rules. Households created before
// accounts existed keep working the old way (just their code) until claimed.

const firebaseConfig = {
  apiKey: "AIzaSyA_krjo8I-OFxJxqhQuuRV2_Revwy5oTrc",
  authDomain: "chore-chart-nsr.firebaseapp.com",
  projectId: "chore-chart-nsr",
  storageBucket: "chore-chart-nsr.firebasestorage.app",
  messagingSenderId: "974093926063",
  appId: "1:974093926063:web:e49c1e0de62b3125869e5a",
};

const HOUSEHOLD_CODE_KEY = "choreChartHouseholdCode";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O/1/I/L — easy to read and type

function generateHouseholdCode() {
  let code = "";
  for (let i = 0; i < 6; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return code;
}

function getStoredCode() {
  try {
    return localStorage.getItem(HOUSEHOLD_CODE_KEY);
  } catch (e) {
    return null;
  }
}

function saveCode(code) {
  try {
    localStorage.setItem(HOUSEHOLD_CODE_KEY, code);
  } catch (e) {
    /* ignore — worst case, asks again next load */
  }
}

function showCodeBadge(code) {
  const badge = document.createElement("div");
  badge.textContent = "Household: " + code;
  badge.style.cssText =
    "position:fixed;bottom:10px;right:10px;background:#2B2250;color:#F8F5FF;" +
    "font:700 11px -apple-system,sans-serif;padding:6px 12px;border-radius:999px;" +
    "z-index:9999;opacity:0.85;box-shadow:0 2px 8px rgba(0,0,0,0.2);";
  document.body.appendChild(badge);
}

// A condensed how-to-use guide, as one reusable overlay — shown
// automatically once per device right after first-time setup (so a parent
// never has to explain the app by hand to someone they share it with), and
// also exposed globally so the in-app help button can reopen the exact same
// content on demand later, with nothing duplicated between the two.
function showHelpModal() {
  const overlay = document.createElement("div");
  overlay.style.cssText =
    "position:fixed;inset:0;background:rgba(43,34,80,0.45);" +
    "display:flex;align-items:center;justify-content:center;z-index:99999;" +
    "font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;";

  const card = document.createElement("div");
  card.style.cssText =
    "background:#fff;border-radius:22px;padding:28px;max-width:420px;width:100%;" +
    "max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.3);box-sizing:border-box;";

  const section = (title, body) =>
    '<div style="font-size:14px;font-weight:800;color:#7B61FF;margin:18px 0 6px;">' + title + "</div>" +
    '<div style="font-size:13.5px;color:#4A4470;font-weight:500;line-height:1.5;">' + body + "</div>";

  card.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' +
    '<div style="font-size:20px;font-weight:800;color:#2B2250;flex:1;">How The Chore Chart works</div>' +
    '<button id="cc-help-close" aria-label="Close" style="border:none;background:none;color:#B7ACE3;font-size:20px;cursor:pointer;padding:4px;line-height:1;">&times;</button>' +
    "</div>" +
    section("The five chore types",
      "<b>Morning / Evening</b> reset daily, on the days you pick. <b>Anytime</b> is either one-time or weekly with a due day. <b>Bonus</b> pays points instantly and runs on its own schedule. <b>Books</b> are one-time and stay in a permanent reading log.") +
    section("Earning points",
      "Any chore can carry its own point value, set when adding or editing it — Morning, Evening, and Anytime default to 0, while Bonus and Books default to a real value since that's usually the point of using them. Separately, finishing every Morning, Evening, and Anytime chore in a day earns a completion bonus too, on top of whatever individual chores paid.") +
    section("Redeeming rewards",
      "Tap <b>Redeem</b> next to a kid's points to spend them from the reward menu. Redemptions log automatically.") +
    section("The parent lock",
      "Most of the app is open for kids — checking off chores, adding their own tasks. The parent PIN unlocks editing or deleting any chore, renaming kids, manually adjusting a kid's point total, creating or managing the rewards menu, managing linked devices, and downloading or restoring a backup. All of that lives under Settings, which appears once you unlock. Settings also has a clock screen saver you can turn on for just one device, like a wall tablet. Adding a point-bearing chore while locked offers a choice: enter the PIN to approve it immediately, or skip to submit it for approval. The lock re-engages after 2 minutes of inactivity.") +
    section("Staying in sync",
      "The parent who sets it up signs in with Google or email and owns the household. Other devices, like the kids' tablet or the other parent's phone, join with a one-time code: unlock, tap Settings, then Devices, then Link a new device, then on the other device tap \u201cJoin a family's chart\u201d and type the code. No email needed. Everyone connected sees the same live data.") +
    '<div style="margin-top:20px;font-size:11.5px;font-weight:600;color:#A79ED1;">Version ' + (window.__ccBuild || "dev") + "</div>";

  overlay.appendChild(card);
  document.body.appendChild(overlay);

  const close = () => document.body.removeChild(overlay);
  card.querySelector("#cc-help-close").onclick = close;
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) close();
  });
}
window.showChoreChartHelp = showHelpModal;

// Resolves once this device has a way into a household and Firestore is wired
// up. window.storage and window.subscribeToSync aren't safe to call before then.
// (Skipped entirely in demo mode, which never touches Firebase: see demo.js.)
if (!window.__ccDemo) window.__syncReady = (async () => {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const fns = firebase.functions(); // us-central1, where the functions are published

  // Works out how this device gets in (showing the sign-in, link-code or setup
  // screens as needed) and resolves once it has a way in.
  const session = await CCAcct.start({ db, auth, fns, authDomain: firebaseConfig.authDomain });
  CCAcct.finish(session);

  // First time THIS DEVICE has ever set up the app: show the how-to-use guide
  // once, so a parent never has to walk a new person through it by hand.
  // Purely local to this device, never synced.
  try {
    if (!localStorage.getItem("cc-seen-help")) {
      localStorage.setItem("cc-seen-help", "1");
      showHelpModal();
    }
  } catch (e) {
    // Private browsing or storage disabled: not worth blocking setup over.
  }

  const docRef = db.collection("households").doc(session.hid);
  // If the rules start refusing us, this device was removed (or the old-style
  // grace period ended): hand over to the account code, which shows the right screen.
  const lost = (e) => {
    if (e && e.code === "permission-denied") CCAcct.handleAccessLost();
  };

  window.storage = {
    async get(key) {
      // Only a genuinely-missing document should be treated as "no data yet"
      // (falls back to starter/demo data). A failed fetch (quota, network,
      // anything) must NOT look the same, or a real outage silently
      // masquerades as an empty new household.
      let snap;
      try {
        snap = await docRef.get();
      } catch (e) {
        lost(e);
        throw e;
      }
      if (!snap.exists) return null;
      return { key, value: JSON.stringify(snap.data()), shared: true };
    },
    async set(key, value) {
      try {
        await docRef.set(JSON.parse(value));
        return { key, value, shared: true };
      } catch (e) {
        lost(e);
        return null;
      }
    },
    async delete(key) {
      try {
        await docRef.delete();
        return { key, deleted: true, shared: true };
      } catch (e) {
        lost(e);
        return null;
      }
    },
    async list() {
      return { keys: [], shared: true };
    },
  };

  // Live sync: fires whenever the document changes, from this device or any
  // other one connected to the same household.
  window.subscribeToSync = function (callback) {
    return docRef.onSnapshot(
      (snap) => {
        if (snap.exists) callback(snap.data());
      },
      (err) => {
        console.error("Sync error:", err);
        lost(err);
      }
    );
  };

  // Old-style households only (accounts don't use a code as the key).
  if (session.mode === "legacy") {
    // Migration: copies the current household's data into a brand-new,
    // never-touched document and switches this device over to it. Exists as
    // an escape hatch for when the shared document itself gets rate-limited
    // by Firestore (independent of daily quota) — moving the data to a fresh
    // document sidesteps that without losing anything or starting over.
    function showMigrateConfirm() {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed;inset:0;background:rgba(43,34,80,0.45);display:flex;align-items:center;justify-content:center;z-index:99999;" +
          "font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;";
        const card = document.createElement("div");
        card.style.cssText =
          "background:#fff;border-radius:22px;padding:26px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3);" +
          "text-align:center;box-sizing:border-box;";
        card.innerHTML =
          '<div style="font-size:17px;font-weight:800;color:#2B2250;margin-bottom:10px;">Migrate to a fresh household?</div>' +
          '<div style="font-size:13px;color:#8A82C0;font-weight:600;margin-bottom:20px;">Copies everything \u2014 kids, chores, points \u2014 into a brand-new household. ' +
          "You'll need to enter the new code on your other devices afterward.</div>" +
          '<button id="mig-confirm" style="width:100%;padding:12px;border:none;border-radius:12px;' +
          'background:linear-gradient(135deg,#FF6B9D,#7B61FF);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;margin-bottom:10px;">Migrate</button>' +
          '<button id="mig-cancel" style="width:100%;padding:12px;border:2px solid #E2DBFA;border-radius:12px;' +
          'background:#fff;color:#5D5490;font-weight:700;font-size:14.5px;cursor:pointer;">Cancel</button>';
        overlay.appendChild(card);
        document.body.appendChild(overlay);
        card.querySelector("#mig-confirm").onclick = () => {
          document.body.removeChild(overlay);
          resolve(true);
        };
        card.querySelector("#mig-cancel").onclick = () => {
          document.body.removeChild(overlay);
          resolve(false);
        };
      });
    }

    function showMigratedScreen(newCode) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed;inset:0;background:linear-gradient(135deg,#FF6B9D,#7B61FF);display:flex;align-items:center;justify-content:center;z-index:99999;" +
          "font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;";
        const card = document.createElement("div");
        card.style.cssText =
          "background:#fff;border-radius:22px;padding:28px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3);" +
          "text-align:center;box-sizing:border-box;";
        card.innerHTML =
          '<div style="font-size:15px;font-weight:700;color:#8A82C0;margin-bottom:10px;">Migration complete \u2014 new household code</div>' +
          '<div style="font-size:38px;font-weight:800;letter-spacing:6px;color:#2B2250;margin-bottom:16px;font-family:monospace;">' +
          newCode +
          "</div>" +
          '<div style="font-size:13px;color:#8A82C0;font-weight:600;margin-bottom:22px;">Enter this exact code on your other devices (Join household) to reconnect them. This device will reload now.</div>' +
          '<button id="mig-continue" style="width:100%;padding:13px;border:none;border-radius:12px;' +
          'background:linear-gradient(135deg,#FF6B9D,#7B61FF);color:#fff;font-weight:700;font-size:15px;cursor:pointer;">Continue</button>';
        overlay.appendChild(card);
        document.body.appendChild(overlay);
        card.querySelector("#mig-continue").onclick = () => {
          document.body.removeChild(overlay);
          resolve();
        };
      });
    }

    window.migrateToFreshHousehold = async function () {
      const confirmed = await showMigrateConfirm();
      if (!confirmed) return;

      try {
        const snap = await docRef.get();
        if (!snap.exists) {
          alert("No data found to migrate.");
          return;
        }
        const data = snap.data();
        const newCode = generateHouseholdCode();
        const newDocRef = db.collection("households").doc(newCode);
        await newDocRef.set(data);
        saveCode(newCode);
        await showMigratedScreen(newCode);
        window.location.reload();
      } catch (e) {
        alert("Migration failed: " + (e && e.message ? e.message : "unknown error") + "\n\nYour original data is untouched — safe to try again.");
      }
    };

    showCodeBadge(session.hid);
  }
})();

</script>

<script>
// Registers the service worker and shows a small "new version" banner when a
// newer build takes over. Written in plain old-style JavaScript on purpose so
// it also runs on older tablets.
(function () {
  function showUpdateBanner() {
    if (document.getElementById("cc-update-banner")) return;

    // A full-width, click-through wrapper that just centres the card —
    // sizing the card itself off "left: 50%" would squeeze it to half the
    // screen and wrap the text.
    var bar = document.createElement("div");
    bar.id = "cc-update-banner";
    bar.setAttribute("role", "status");
    bar.style.cssText =
      "position:fixed;left:0;right:0;bottom:20px;bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);" +
      "z-index:99990;box-sizing:border-box;padding:0 12px;pointer-events:none;" +
      "display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;";

    var card = document.createElement("div");
    card.style.cssText =
      "pointer-events:auto;box-sizing:border-box;max-width:100%;display:-webkit-flex;display:flex;" +
      "-webkit-align-items:center;align-items:center;padding:6px 8px 6px 18px;" +
      "background:#ffffff;border:2px solid #E2DBFA;border-radius:999px;" +
      "box-shadow:0 10px 28px rgba(43,34,80,0.22);" +
      "font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;";

    var msg = document.createElement("span");
    msg.textContent = "A new version is ready";
    msg.style.cssText = "font-size:14px;font-weight:800;color:#2B2250;margin-right:6px;";

    var later = document.createElement("button");
    later.type = "button";
    later.textContent = "Later";
    later.style.cssText =
      "min-height:44px;padding:0 12px;margin-right:4px;border:none;background:none;cursor:pointer;" +
      "font-family:inherit;font-size:14px;font-weight:700;color:#6F66AD;";
